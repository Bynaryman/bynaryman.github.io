      <text x="470" y="152">System calls</text>
      <text x="690" y="286">CPU time · Memory · Files · Device access</text>
      <text x="690" y="365">Hardware access, through drivers</text>
      <text x="690" y="462">Processor · RAM · Storage · Network · Keyboard, mouse, screen</text>
