<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="550" viewBox="0 0 1400 550" role="img" aria-labelledby="title desc">
  <title id="title">The user reaches applications through hardware and the operating system</title>
  <desc id="desc">Browser, music player and Bash are above the Linux kernel. Below the kernel are the processor, memory, storage and network, and the keyboard, mouse and screen. The user is below these input and output devices. Two-way arrows connect the user to the devices, the devices to the kernel, and the kernel to applications.</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" viewBox="0 0 9 9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#111" stroke-width="1.5"/></marker>
  </defs>
  <g font-family="DejaVu Sans, sans-serif" fill="#111">
    <g fill="#111" opacity=".28">
      <path d="M30 30h410v68H30zM495 30h410v68H495zM960 30h410v68H960zM30 170h1340v100H30zM30 350h640v70H30zM730 350h640v70H730zM900 480h300v58H900z"/>
    </g>
    <g stroke="#111" stroke-width="2">
      <path d="M20 20h410v68H20z" fill="#d4f4df"/>
      <path d="M485 20h410v68H485z" fill="#f7d5ec"/>
      <path d="M950 20h410v68H950z" fill="#fff0b5"/>
      <path d="M20 160h1340v100H20z" fill="#e3edfc"/>
      <path d="M20 340h640v70H20zM720 340h640v70H720z" fill="#fff0b5"/>
      <path d="M890 470h300v58H890z" fill="#f7d5ec"/>
    </g>
    <g text-anchor="middle" font-size="36" font-weight="bold">
      <text x="225" y="66" fill="#00502e">Browser</text>
      <text x="690" y="66" fill="#651046">Music player</text>
      <text x="1155" y="66" fill="#5a2e00">Bash</text>
      <text x="690" y="201" fill="#003b80">Linux kernel</text>
      <text x="1040" y="510" fill="#651046">User</text>
    </g>
    <g fill="none" stroke="#111" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)">
      <path d="M225 101v45"/><path d="M690 101v45"/><path d="M1155 101v45"/>
      <path d="M340 277v49"/><path d="M1040 277v49"/>
      <path d="M1040 425v32"/>
    </g>
    <g text-anchor="middle" font-size="29">
      <text x="450" y="133">System calls</text>
      <text x="690" y="241">CPU time · Memory · Files · Device access</text>
      <text x="690" y="311">Hardware access</text>
      <text x="340" y="385">CPU · RAM · Storage · Network</text>
      <text x="1040" y="385">Keyboard · Mouse · Screen</text>
      <text x="825" y="448" fill="#5a2e00">Type, click</text>
      <text x="1220" y="448" fill="#5a2e00">See the result</text>
    </g>
    <g font-size="28" fill="#003b80">
      <text x="30" y="467">A keystroke reaches a program through the OS.</text>
      <text x="30" y="509">Its response comes back through the screen.</text>
    </g>
  </g>
</svg>
