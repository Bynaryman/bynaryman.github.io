<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="510" viewBox="0 0 1400 510" role="img" aria-labelledby="title desc">
  <title id="title">Programs, kernel and hardware</title>
  <desc id="desc">Running programs request services through system calls. The Linux kernel shares processor time and memory, manages files and controls access to devices through drivers.</desc>
