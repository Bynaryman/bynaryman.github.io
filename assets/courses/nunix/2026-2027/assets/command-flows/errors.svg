<text x="175" y="230" text-anchor="middle" font-size="21" fill="#003b80" font-weight="bold">stdin 0</text>
<rect x="400" y="200" width="110" height="45" fill="#d4f4df" stroke="#00502e" stroke-width="3"/>
<text x="455" y="230" text-anchor="middle" font-size="21" fill="#00502e" font-weight="bold">stdout 1</text>
<text x="315.0" y="24" text-anchor="middle" font-size="27" fill="#8a3b00" font-weight="bold">Arguments</text>
<rect x="129" y="48" width="390" height="48" fill="#111" opacity=".3"/>
<rect x="120" y="39" width="390" height="48" fill="#fff0b5" stroke="#8a3b00" stroke-width="3"/>
<text x="315.0" y="72" text-anchor="middle" font-size="28" fill="#8a3b00" font-family="DejaVu Sans Mono, monospace">. -name &#x27;*.txt&#x27;</text>
