name: Check source metadata
on:
  pull_request:
    paths: ["_bibliography/**", "assets/json/**", "_plugins/**", "_config.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.2"
          bundler-cache: true
      - run: bundle exec jekyll build --strict_front_matter
      - run: python3 scripts/check_site.py _site
