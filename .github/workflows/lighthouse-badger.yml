name: Lighthouse reports
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy site]
    types: [completed]
permissions:
  contents: read
jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        page: [home, publications, cv, projects, courses, blog]
        device: [mobile, desktop]
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: browser-actions/setup-chrome@v1
      - name: Measure the deployed site
        env:
          PAGE: ${{ matrix.page }}
          DEVICE: ${{ matrix.device }}
        run: |
          SITE_PATH="/$PAGE/"
          if [ "$PAGE" = home ]; then SITE_PATH=/; fi
          EXTRA=()
          if [ "$DEVICE" = desktop ]; then EXTRA+=(--preset=desktop); fi
          npx --yes --package lighthouse@13.5.0 lighthouse "https://bynaryman.github.io$SITE_PATH" --chrome-flags="--headless --no-sandbox" --output=html --output=json --output-path=report "${EXTRA[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ matrix.page }}-${{ matrix.device }}
          path: report.*
