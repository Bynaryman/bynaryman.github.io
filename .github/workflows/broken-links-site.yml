name: Check generated links
on:
  workflow_dispatch:
  pull_request:
    paths:
      [
        "assets/**",
        "_pages/**",
        "_projects/**",
        "_posts/**",
        "_bibliography/**",
        "_includes/**",
        "_layouts/**",
        "_plugins/**",
        "_config.yml",
        "scripts/**",
      ]
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.2"
          bundler-cache: true
      - run: bundle exec jekyll build
      - run: python3 scripts/check_site.py _site
