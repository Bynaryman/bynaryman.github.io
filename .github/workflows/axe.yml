name: Axe accessibility testing
on:
  workflow_dispatch:
  pull_request:
    paths: ["_layouts/**", "_includes/**", "_sass/**", "assets/js/**", "_pages/**", "_config.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.2"
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build && npm run purge
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
          install-chromedriver: true
      - name: Check representative pages
        run: |
          python3 -m http.server 8080 --directory _site &
          for attempt in 1 2 3 4 5; do curl -fsS http://localhost:8080/ -o /dev/null && break || sleep 1; done
          npx --yes --package @axe-core/cli@4.13.0 axe http://localhost:8080/ http://localhost:8080/publications/ http://localhost:8080/cv/ http://localhost:8080/projects/ http://localhost:8080/courses/ http://localhost:8080/blog/ --chromedriver-path "${{ steps.chrome.outputs.chromedriver-path }}" --chrome-options="no-sandbox" --load-delay=1000 --save axe-results.json --exit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-results
          path: axe-results.json
